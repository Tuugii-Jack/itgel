openapi: 3.1.0
info:
  title: itgel API
  version: 1.0.0
  description: |
    Захиалгын дэлгүүрийн backend API.

    - Бүх мөнгөн дүн бүхэл тоо (₮).
    - Бүх огноо ISO 8601, `Asia/Ulaanbaatar` (UTC+8) цагаар бодогдоно.
    - Хэрэглэгчийн API `costPrice`-г хэзээ ч буцаахгүй.
servers:
  - url: http://localhost:4000
    description: Dev

tags:
  - name: public
    description: Хэрэглэгчийн API
  - name: admin
    description: Админ API (JWT + ADMIN/STAFF role)

security: []

paths:
  /health:
    get:
      tags: [public]
      summary: Үйлчилгээний эрүүл мэнд
      responses:
        '200':
          description: OK

  # ------------------------- Хэрэглэгчийн API -------------------------

  /api/categories:
    get:
      tags: [public]
      summary: Идэвхтэй ангиллууд
      responses:
        '200':
          description: Ангиллын жагсаалт
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PublicCategory' }

  /api/products:
    get:
      tags: [public]
      summary: Барааны жагсаалт
      parameters:
        - { name: category, in: query, schema: { type: string } }
        - { name: type, in: query, schema: { type: string, enum: [order, ready] } }
        - { name: q, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 20, maximum: 60 } }
        - { name: sort, in: query, schema: { type: string, enum: [new, priceAsc, priceDesc, closing] } }
      responses:
        '200':
          description: Хуудаслалттай жагсаалт
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PublicProduct' }
                  meta: { $ref: '#/components/schemas/PageMeta' }

  /api/products/{id}:
    get:
      tags: [public]
      summary: Барааны дэлгэрэнгүй (variants, sizeChart, arriveFrom/To)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Бараа
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PublicProduct' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/auth/otp:
    post:
      tags: [public]
      summary: SMS код илгээх
      description: Нэг дугаарт 60 секундэд нэг удаа, цагт 5 удаа.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string, example: '99112233' }
      responses:
        '200':
          description: Код илгээгдлээ
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      phone: { type: string }
                      expiresInSec: { type: integer }
                      resendAfterSec: { type: integer }
                      devCode: { type: string, description: Зөвхөн dev орчинд }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/auth/verify:
    post:
      tags: [public]
      summary: Код шалгаж JWT авах
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone: { type: string }
                code: { type: string, pattern: '^\d{4}$' }
                name: { type: string }
      responses:
        '200':
          description: Токен
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      token: { type: string }
                      customer: { $ref: '#/components/schemas/Customer' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/me:
    get:
      tags: [public]
      security: [{ bearerAuth: [] }]
      summary: Профайлын мэдээлэл
      responses:
        '200':
          description: Хэрэглэгч
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [public]
      security: [{ bearerAuth: [] }]
      summary: Нэр, хадгалсан хаяг, мэдэгдэл, буцаалтын данс засах
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, nullable: true }
                district: { type: string, nullable: true }
                khoroo: { type: string, nullable: true }
                addressText: { type: string, nullable: true }
                notifyPayment: { type: boolean }
                notifyArrival: { type: boolean }
                notifyPromo: { type: boolean }
                bankName: { type: string, nullable: true }
                bankAccountNumber: { type: string, nullable: true }
                bankAccountName: { type: string, nullable: true }
      responses:
        '200': { description: Шинэчлэгдсэн профайл }

  /api/me/orders:
    get:
      tags: [public]
      security: [{ bearerAuth: [] }]
      summary: Өөрийн захиалгын түүх (timeline-тай)
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: pageSize, in: query, schema: { type: integer } }
      responses:
        '200':
          description: Захиалгууд ба нийлбэрүүд
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PublicOrder' }
                  meta:
                    allOf:
                      - $ref: '#/components/schemas/PageMeta'
                      - type: object
                        properties:
                          totalSpent: { type: integer }
                          activeCount: { type: integer }

  /api/orders:
    post:
      tags: [public]
      summary: Захиалга үүсгэх
      description: IP-ээр 10 минутад 10 удаа хязгаартай.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, items]
              properties:
                phone: { type: string }
                name: { type: string }
                note: { type: string }
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [productId, qty]
                    properties:
                      productId: { type: string }
                      qty: { type: integer, minimum: 1 }
                      size: { type: string }
                      color: { type: string }
      responses:
        '201':
          description: Үүссэн захиалга
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      code: { type: string, example: PH-K7M2XQ }
                      status: { $ref: '#/components/schemas/OrderStatus' }
                      subtotal: { type: integer }
                      dueAmount: { type: integer }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/orders/{code}:
    get:
      tags: [public]
      summary: Захиалгын хяналт (timeline-тай)
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Захиалга
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PublicOrder' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/orders/{code}/fulfilment:
    post:
      tags: [public]
      summary: Авах хэлбэр сонгох (зөвхөн ARRIVED төлөвт). Хүргэлтээр авахад үлдсэн карго төлүүлнэ; очиж авахад карго шаардахгүй.
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { type: string, enum: [PICKUP, DELIVERY] }
                payMethod: { type: string, enum: [QPAY], description: 'Хүргэлтээр авахад карго үлдсэн бол QPay' }
                district: { type: string }
                khoroo: { type: string }
                address: { type: string }
      responses:
        '200': { description: Шинэчлэгдсэн захиалга }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/delivery/slots:
    get:
      tags: [public]
      summary: Хүргэлтийн сул хэмжээ, дүүргийн хураамж
      parameters:
        - { name: days, in: query, schema: { type: integer, default: 14, maximum: 30 } }
      responses:
        '200':
          description: Өдөр тус бүрийн сул хэмжээ
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      slots:
                        type: array
                        items: { $ref: '#/components/schemas/Slot' }
                      districts:
                        type: array
                        items:
                          type: object
                          properties:
                            district: { type: string }
                            fee: { type: integer }

  /api/store:
    get:
      tags: [public]
      summary: Дэлгүүрийн мэдээлэл
      responses:
        '200': { description: Хаяг, цаг, утас, Facebook }

  # ------------------------------ Админ ------------------------------

  /api/admin/auth/login:
    post:
      tags: [admin]
      summary: Админ нэвтрэх
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200': { description: JWT токен }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/admin/auth/me:
    get:
      tags: [admin]
      security: [{ bearerAuth: [] }]
      summary: Нэвтэрсэн админ
      responses:
        '200': { description: Админ }

  /api/admin/products:
    get:
      tags: [admin]
      security: [{ bearerAuth: [] }]
      summary: Барааны жагсаалт (costPrice, ашигтай)
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ProductStatus' } }
        - { name: category, in: query, schema: { type: string } }
        - { name: type, in: query, schema: { type: string, enum: [order, ready] } }
        - { name: q, in: query, schema: { type: string } }
        - { name: includeDeleted, in: query, schema: { type: boolean } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: pageSize, in: query, schema: { type: integer } }
      responses:
        '200':
          description: Жагсаалт
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AdminProduct' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
    post:
      tags: [admin]
      security: [{ bearerAuth: [] }]
      summary: Бараа үүсгэх
      description: leadMinDays/leadMaxDays илгээгээгүй бол тохиргооны анхны утга (7–14) орно.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '201': { description: Үүссэн бараа }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/admin/products/{id}:
    get:
      tags: [admin]
      security: [{ bearerAuth: [] }]
      summary: Барааны дэлгэрэнгүй
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Бараа }
    patch:
      tags: [admin]
      security: [{ bearerAuth: [] }]
      summary: Бараа засах
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '200': { description: Засагдсан бараа }
    delete:
      tags: [admin]
      security: [{ bearerAuth: [] }]
      summary: Бараа устгах (soft delete)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Устгасан тоо }

  /api/admin/products/bulk-status:
    post:
      tags: [admin]
      security: [{ bearerAuth: [] }]
      summary: Олон барааны төлөв солих
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, status]
              properties:
                ids: { type: array, items: { type: string } }
                status: { $ref: '#/components/schemas/ProductStatus' }
      responses:
        '200': { description: Шинэчлэгдсэн тоо }

  /api/admin/products/bulk-delete:
    post:
      tags: [admin]
      security: [{ bearerAuth: [] }]
      summary: Олон бараа устгах (soft delete)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: { type: array, items: { type: string } }
      responses:
        '200': { description: Устгасан тоо }

  /api/admin/products/{id}/images:
    post:
      tags: [admin]
      security: [{ bearerAuth: [] }]
      summary: Зураг байршуулах presigned URL
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contentType]
              properties:
                contentType: { type: string, example: image/jpeg }
                fileName: { type: string }
      responses:
        '200':
          description: Presigned upload
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      uploadUrl: { type: string }
                      publicUrl: { type: string }
                      key: { type: string }
                      method: { type: string, enum: [PUT] }
                      expiresInSec: { type: integer }
                      provider: { type: string, enum: [supabase, r2, mock] }
    patch:
      tags: [admin]
      security: [{ bearerAuth: [] }]
      summary: Байршуулсан зургийн URL-уудыг бүртгэх
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [images]
              properties:
                images: { type: array, items: { type: string, format: uri } }
      responses:
        '200': { description: Зургийн жагсаалт }

  /api/admin/categories:
    get:
      tags: [admin]
      security: [{ bearerAuth: [] }]
      summary: Бүх ангилал (барааны тоотой)
      responses:
        '200': { description: Жагсаалт }
    post:
      tags: [admin]
      security: [{ bearerAuth: [] }]
      summary: Ангилал үүсгэх
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                isActive: { type: boolean }
                sortOrder: { type: integer }
      responses:
        '201': { description: Үүссэн ангилал }

  /api/admin/categories/{id}:
    patch:
      tags: [admin]
      security: [{ bearerAuth: [] }]
      summary: Ангилал засах
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                isActive: { type: boolean }
                sortOrder: { type: integer }
      responses:
        '200': { description: Засагдсан ангилал }
    delete:
      tags: [admin]
      security: [{ bearerAuth: [] }]
      summary: Ангилал устгах
      description: Бараатай ангилал устгагдахгүй — 409.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Устгагдлаа }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/admin/orders:
    get:
      tags: [admin]
      security: [{ bearerAuth: [] }]
      summary: Захиалгын жагсаалт
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/OrderStatus' } }
        - { name: q, in: query, schema: { type: string }, description: 'Код, утас, нэрээр' }
        - { name: batch, in: query, schema: { type: string } }
        - { name: fulfilment, in: query, schema: { type: string, enum: [PICKUP, DELIVERY] } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: pageSize, in: query, schema: { type: integer } }
      responses:
        '200': { description: Жагсаалт }

  /api/admin/orders/{id}:
    get:
      tags: [admin]
      security: [{ bearerAuth: [] }]
      summary: Захиалгын дэлгэрэнгүй
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Захиалга }

  /api/admin/orders/{id}/status:
    patch:
      tags: [admin]
      security: [{ bearerAuth: [] }]
      summary: Төлөв солих
      description: |
        Зөвшөөрөгдөх шилжилт: NEW→CONFIRMED→IN_BATCH→IN_TRANSIT→ARRIVED→HANDED_OVER.
        CANCELLED руу HANDED_OVER-с бусад бүх төлвөөс. Буруу шилжилтэд 409.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/OrderStatus' }
                reason: { type: string }
      responses:
        '200': { description: Шинэчлэгдсэн захиалга }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/admin/batches:
    get:
      tags: [admin]
      security: [{ bearerAuth: [] }]
      summary: Багцын жагсаалт
      parameters:
        - { name: stage, in: query, schema: { $ref: '#/components/schemas/BatchStage' } }
      responses:
        '200': { description: Жагсаалт }
    post:
      tags: [admin]
      security: [{ bearerAuth: [] }]
      summary: Багц үүсгэх
      description: orderIds заагаагүй бол багцгүй, баталгаажсан бүх захиалгыг оруулна.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                orderIds: { type: array, items: { type: string } }
                weightKg: { type: integer }
                etaFrom: { type: string, format: date-time }
                etaTo: { type: string, format: date-time }
      responses:
        '201': { description: Үүссэн багц }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/admin/batches/{id}:
    get:
      tags: [admin]
      security: [{ bearerAuth: [] }]
      summary: Багцын дэлгэрэнгүй
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Багц }
    patch:
      tags: [admin]
      security: [{ bearerAuth: [] }]
      summary: Багц засах (жин, ETA)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                weightKg: { type: integer, nullable: true }
                etaFrom: { type: string, format: date-time, nullable: true }
                etaTo: { type: string, format: date-time, nullable: true }
      responses:
        '200': { description: Засагдсан багц }

  /api/admin/batches/{id}/advance:
    post:
      tags: [admin]
      security: [{ bearerAuth: [] }]
      summary: Дараагийн шат руу
      description: |
        Дотор байгаа захиалгууд автоматаар дагаж шилжинэ
        (IN_TRANSIT → захиалга IN_TRANSIT, AT_WAREHOUSE → ARRIVED).
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Шинэ шат, шилжсэн захиалгын тоо }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/admin/batches/{id}/orders:
    post:
      tags: [admin]
      security: [{ bearerAuth: [] }]
      summary: Захиалга нэмэх, хасах
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                add: { type: array, items: { type: string } }
                remove: { type: array, items: { type: string } }
      responses:
        '200': { description: Нэмэгдсэн/хасагдсан тоо }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/admin/handover/lookup:
    get:
      tags: [admin]
      security: [{ bearerAuth: [] }]
      summary: QR эсвэл кодоор захиалга хайх
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: Захиалга, canHandOver-той }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/admin/handover/history:
    get:
      tags: [admin]
      security: [{ bearerAuth: [] }]
      summary: Хүлээлгэн өгсөн бараа, бэлэн/карт орлого (UB сар)
      parameters:
        - { name: year, in: query, required: true, schema: { type: integer } }
        - { name: month, in: query, required: true, schema: { type: integer, minimum: 1, maximum: 12 } }
      responses:
        '200': { description: Өдөр, хэрэглэгч, бэлэн/карт }

  /api/admin/handover/{orderId}/complete:
    post:
      tags: [admin]
      security: [{ bearerAuth: [] }]
      summary: Хүлээлгэн өгөх
      parameters: [{ name: orderId, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                collectedAmount: { type: integer, description: 'Хоосон бол dueAmount-тай тэнцүү гэж үзнэ' }
                method: { type: string, enum: [CASH, CARD], description: 'Үлдэгдэл авсан хэлбэр' }
                note: { type: string }
      responses:
        '200': { description: Хүлээлгэн өгсөн захиалга }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/admin/deliveries:
    get:
      tags: [admin]
      security: [{ bearerAuth: [] }]
      summary: Хүргэлтүүд
      parameters:
        - { name: day, in: query, schema: { type: string, format: date } }
        - { name: days, in: query, schema: { type: string }, description: 'YYYY-MM-DD,YYYY-MM-DD' }
        - { name: status, in: query, schema: { type: string, enum: [PENDING, ASSIGNED, DELIVERED] } }
        - { name: district, in: query, schema: { type: string } }
      responses:
        '200': { description: Жагсаалт }

  /api/admin/deliveries/history:
    get:
      tags: [admin]
      security: [{ bearerAuth: [] }]
      summary: Хүргэлтийн түүх (UB сар, өдрөөр)
      parameters:
        - { name: year, in: query, required: true, schema: { type: integer } }
        - { name: month, in: query, required: true, schema: { type: integer, minimum: 1, maximum: 12 } }
      responses:
        '200': { description: Өдөр, дүүрэг, хүргэлтийн хүн }

  /api/admin/returns/calendar:
    get:
      tags: [admin]
      security: [{ bearerAuth: [] }]
      summary: Захиалгын мөрөөр буцаасан өдрүүд (UB сар)
      parameters:
        - { name: year, in: query, required: true, schema: { type: integer } }
        - { name: month, in: query, required: true, schema: { type: integer, minimum: 1, maximum: 12 } }
      responses:
        '200': { description: Өдөр бүрийн тоо, хэрэглэгч }

  /api/admin/returns:
    get:
      tags: [admin]
      security: [{ bearerAuth: [] }]
      summary: Сонгосон өдрүүдийн буцаалтын бараа, шилжүүлэх данс
      parameters:
        - { name: days, in: query, required: true, schema: { type: string }, description: 'YYYY-MM-DD,YYYY-MM-DD' }
      responses:
        '200': { description: Нэгтгэсэн бараа болон хэрэглэгчийн данс }

  /api/admin/returns/payouts:
    post:
      tags: [admin]
      security: [{ bearerAuth: [] }]
      summary: Данс руу шилжүүлснийг баталгаажуулна — хэрэглэгчид «Буцаалт орсон»
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [days, customerIds]
              properties:
                days:
                  type: array
                  items: { type: string }
                  description: 'YYYY-MM-DD (10, 20, 30)'
                customerIds:
                  type: array
                  items: { type: string }
      responses:
        '200': { description: Шинэчилсэн бараа болон дансны жагсаалт }

  /api/admin/deliveries/{id}:
    patch:
      tags: [admin]
      security: [{ bearerAuth: [] }]
      summary: Жолооч, төлөв, хаяг засах
      description: DELIVERED болгоход захиалга автоматаар HANDED_OVER болно.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                courierName: { type: string, nullable: true }
                status: { type: string, enum: [PENDING, ASSIGNED, DELIVERED] }
                scheduledDay: { type: string, format: date }
                district: { type: string }
                khoroo: { type: string, nullable: true }
                addressText: { type: string, nullable: true }
                fee: { type: integer }
      responses:
        '200': { description: Засагдсан хүргэлт }

  /api/admin/customers:
    get:
      tags: [admin]
      security: [{ bearerAuth: [] }]
      summary: Хэрэглэгчид — захиалгын тоо, нийт зарцуулалт, сүүлд
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: pageSize, in: query, schema: { type: integer } }
      responses:
        '200': { description: Жагсаалт }

  /api/admin/customers/{id}:
    get:
      tags: [admin]
      security: [{ bearerAuth: [] }]
      summary: Хэрэглэгчийн дэлгэрэнгүй, захиалгын түүх
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Хэрэглэгч }

  /api/admin/reports/revenue:
    get:
      tags: [admin]
      security: [{ bearerAuth: [] }]
      summary: Сар тус бүрийн борлуулалт, буцаалт (зарах үнэ)
      parameters:
        - { name: period, in: query, schema: { type: string, enum: ['3m', '6m', '1y'], default: '6m' } }
        - { name: productIds, in: query, schema: { type: string }, description: 'id,id' }
      responses:
        '200': { description: Сарын цуваа ба нийлбэр }

  /api/admin/reports/products:
    get:
      tags: [admin]
      security: [{ bearerAuth: [] }]
      summary: Бараа бүрийн зарагдсан / буцаасан тоо, дүн
      parameters:
        - { name: period, in: query, schema: { type: string, enum: ['3m', '6m', '1y'] } }
        - { name: productIds, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 200 } }
      responses:
        '200': { description: Жагсаалт }

  /api/admin/reports/summary:
    get:
      tags: [admin]
      security: [{ bearerAuth: [] }]
      summary: Хяналтын самбарын товч үзүүлэлт
      responses:
        '200': { description: Тоон үзүүлэлт }

  /api/admin/settings:
    get:
      tags: [admin]
      security: [{ bearerAuth: [] }]
      summary: Тохиргоо
      responses:
        '200': { description: Тохиргоо }
    patch:
      tags: [admin]
      security: [{ bearerAuth: [] }]
      summary: Тохиргоо засах
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Settings' }
      responses:
        '200': { description: Засагдсан тохиргоо }

  /api/admin/settings/audit:
    get:
      tags: [admin]
      security: [{ bearerAuth: [] }]
      summary: Өөрчлөлтийн түүх (audit log)
      parameters:
        - { name: entity, in: query, schema: { type: string } }
        - { name: entityId, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
      responses:
        '200': { description: Лог }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Манай JWT (`/api/auth/verify` эсвэл `/api/admin/auth/login`) эсвэл
        Supabase Auth-ийн access token (JWKS-ээр шалгагдана).

  responses:
    BadRequest:
      description: Оруулсан утга буруу
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Нэвтрэх шаардлагатай
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Олдсонгүй
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Бизнес дүрэм зөрчсөн
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: Хэт олон хүсэлт
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details: {}

    PageMeta:
      type: object
      properties:
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        pages: { type: integer }

    ProductStatus:
      type: string
      enum: [ACTIVE, HIDDEN, DRAFT, CLOSED, SOLD_OUT, ARCHIVED]

    OrderStatus:
      type: string
      enum: [NEW, CONFIRMED, IN_BATCH, IN_TRANSIT, ARRIVED, HANDED_OVER, CANCELLED]

    BatchStage:
      type: string
      enum: [IN_TRANSIT, AT_WAREHOUSE, DONE]

    PublicCategory:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        sortOrder: { type: integer }
        productCount: { type: integer }

    PublicProduct:
      type: object
      description: costPrice энд хэзээ ч байхгүй.
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        categoryId: { type: string }
        price: { type: integer }
        stock: { type: integer }
        type: { type: string, enum: [order, ready] }
        status: { $ref: '#/components/schemas/ProductStatus' }
        closeAt: { type: string, format: date-time, nullable: true }
        leadMinDays: { type: integer }
        leadMaxDays: { type: integer }
        arriveFrom: { type: string, format: date-time }
        arriveTo: { type: string, format: date-time }
        images: { type: array, items: { type: string } }
        sizes: { type: array, items: { type: string } }
        colors: { type: array, items: { type: string } }
        optionPrices:
          type: array
          items:
            type: object
            properties:
              kind: { type: string }
              value: { type: string }
              price: { type: integer }
        skuStocks:
          type: array
          items:
            type: object
            properties:
              selections:
                type: object
                additionalProperties: { type: string }
              stock: { type: integer }
        sizeChart:
          type: array
          items:
            type: object
            properties:
              size: { type: string }
              heightRange: { type: string }
              chestCm: { type: string }

    AdminProduct:
      allOf:
        - $ref: '#/components/schemas/PublicProduct'
        - type: object
          properties:
            costPrice: { type: integer }
            sellPrice: { type: integer }
            profit: { type: integer }
            marginPercent: { type: integer }
            deletedAt: { type: string, format: date-time, nullable: true }

    ProductInput:
      type: object
      required: [name, categoryId, costPrice, sellPrice]
      properties:
        name: { type: string }
        description: { type: string }
        categoryId: { type: string }
        costPrice: { type: integer }
        sellPrice: { type: integer }
        stock: { type: integer }
        closeAt: { type: string, format: date-time, nullable: true }
        leadMinDays: { type: integer }
        leadMaxDays: { type: integer }
        status: { $ref: '#/components/schemas/ProductStatus' }
        images: { type: array, items: { type: string, format: uri } }
        sizes: { type: array, items: { type: string } }
        colors: { type: array, items: { type: string } }
        sizeChart:
          type: array
          items:
            type: object
            required: [size]
            properties:
              size: { type: string }
              heightRange: { type: string }
              chestCm: { type: string }

    Customer:
      type: object
      properties:
        id: { type: string }
        phone: { type: string }
        name: { type: string, nullable: true }

    Me:
      type: object
      properties:
        id: { type: string }
        phone: { type: string }
        name: { type: string, nullable: true }
        address:
          type: object
          properties:
            district: { type: string, nullable: true }
            khoroo: { type: string, nullable: true }
            addressText: { type: string, nullable: true }
        notifications:
          type: object
          properties:
            payment: { type: boolean }
            arrival: { type: boolean }
            promo: { type: boolean }
        bank:
          type: object
          properties:
            name: { type: string }
            accountNumber: { type: string }
            accountName: { type: string }
            defaultPayout: { type: boolean }

    TimelineStep:
      type: object
      properties:
        key:
          type: string
          enum: [placed, confirmed, sent_to_supplier, in_transit, arrived, handed_over, cancelled]
        label: { type: string }
        status: { type: string, enum: [done, current, pending] }
        at: { type: string, format: date-time, nullable: true }
        estimatedAt: { type: string, format: date-time, nullable: true }

    PublicOrder:
      type: object
      properties:
        code: { type: string }
        status: { $ref: '#/components/schemas/OrderStatus' }
        statusLabel: { type: string }
        subtotal: { type: integer }
        paidAmount: { type: integer }
        refundedAmount: { type: integer }
        dueAmount: { type: integer }
        deliveryFee: { type: integer }
        paymentState:
          type: string
          enum: [UNPAID, PARTIAL, PAID, OVERPAID, REFUNDED]
        fulfilment: { type: string, enum: [PICKUP, DELIVERY], nullable: true }
        canChooseFulfilment: { type: boolean }
        items:
          type: array
          items:
            type: object
            properties:
              productId: { type: string }
              name: { type: string }
              size: { type: string, nullable: true }
              color: { type: string, nullable: true }
              qty: { type: integer }
              unitPrice: { type: integer }
              total: { type: integer }
        timeline:
          type: array
          items: { $ref: '#/components/schemas/TimelineStep' }

    Slot:
      type: object
      properties:
        day: { type: string, format: date }
        capacity: { type: integer }
        used: { type: integer }
        remaining: { type: integer }
        available: { type: boolean }

    Settings:
      type: object
      properties:
        storeName: { type: string }
        phone: { type: string }
        address: { type: string }
        workHours: { type: string }
        facebookUrl: { type: string }
        defaultLeadMinDays: { type: integer }
        defaultLeadMaxDays: { type: integer }
        smsOnArrival: { type: boolean }
        autoCloseOnDeadline: { type: boolean }
        deliveryFees:
          type: object
          additionalProperties: { type: integer }
        deliveryDailyLimit: { type: integer }
